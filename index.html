<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Spectrum | Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .task-item { transition: background 0.3s ease; cursor: grab; }
        .task-item:active { cursor: grabbing; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <section class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xl font-bold mb-4 text-sky-400">Add New Task</h2>
                <div class="grid grid-cols-1 gap-3">
                    <input type="text" id="subject" placeholder="Subject (e.g. Math, Work)" class="bg-slate-800 border border-slate-700 p-2 rounded-lg outline-none focus:border-sky-500">
                    <input type="text" id="title" placeholder="Task Title" class="bg-slate-800 border border-slate-700 p-2 rounded-lg outline-none focus:border-sky-500">
                    <div class="flex gap-2">
                        <input type="date" id="due-date" class="bg-slate-800 border border-slate-700 p-2 rounded-lg flex-grow">
                        <button onclick="addTask()" class="bg-sky-600 hover:bg-sky-500 px-6 py-2 rounded-lg font-bold transition">Add Task</button>
                    </div>
                </div>
            </div>

            <div class="glass p-6 rounded-2xl min-h-[500px]">
                <h2 class="text-xl font-bold mb-4">Priority List <span class="text-xs font-normal text-slate-400">(Drag to reorder)</span></h2>
                <div id="task-list" class="space-y-2">
                    </div>
            </div>
        </section>

        <section class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-6 rounded-2xl text-center">
                    <h3 class="text-slate-400 text-sm uppercase tracking-wider">Pending</h3>
                    <p id="count-pending" class="text-4xl font-black text-rose-500">0</p>
                </div>
                <div class="glass p-6 rounded-2xl text-center">
                    <h3 class="text-slate-400 text-sm uppercase tracking-wider">Completed</h3>
                    <p id="count-done" class="text-4xl font-black text-emerald-500">0</p>
                </div>
            </div>

            <div class="glass p-6 rounded-2xl">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">Recently Finished</h2>
                <p class="text-xs text-slate-500 mb-4">Tasks persist for 24 hours before auto-deletion.</p>
                <div id="done-list" class="space-y-2 opacity-60">
                    </div>
            </div>
        </section>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('spectrumTasks')) || [];
        let doneTasks = JSON.parse(localStorage.getItem('spectrumDone')) || [];

        const taskListEl = document.getElementById('task-list');
        const doneListEl = document.getElementById('done-list');

        // Initialize Drag and Drop
        const sortable = new Sortable(taskListEl, {
            animation: 150,
            onEnd: () => {
                reorderTasks();
            }
        });

        function addTask() {
            const subject = document.getElementById('subject').value;
            const title = document.getElementById('title').value;
            const dueDate = document.getElementById('due-date').value;

            if (!title) return alert("Please enter a title");

            const newTask = {
                id: Date.now(),
                subject,
                title,
                dueDate,
                created: new Date().getTime()
            };

            tasks.push(newTask);
            saveAndRender();
            
            // Clear inputs
            document.getElementById('subject').value = '';
            document.getElementById('title').value = '';
        }

        function reorderTasks() {
            const newOrder = [];
            const items = taskListEl.querySelectorAll('.task-item');
            items.forEach(item => {
                const id = item.dataset.id;
                const task = tasks.find(t => t.id == id);
                if (task) newOrder.push(task);
            });
            tasks = newOrder;
            saveAndRender();
        }

        function completeTask(id) {
            const index = tasks.findIndex(t => t.id === id);
            const task = tasks.splice(index, 1)[0];
            task.completedAt = new Date().getTime();
            doneTasks.unshift(task);
            saveAndRender();
        }

        function deleteTask(id, isDoneList = false) {
            if (isDoneList) {
                doneTasks = doneTasks.filter(t => t.id !== id);
            } else {
                tasks = tasks.filter(t => t.id !== id);
            }
            saveAndRender();
        }

        function cleanupDoneTasks() {
            const oneDay = 24 * 60 * 60 * 1000;
            const now = new Date().getTime();
            doneTasks = doneTasks.filter(t => (now - t.completedAt) < oneDay);
        }

        function getColor(index, total) {
            if (total <= 1) return 'rgb(244, 63, 94)'; // Rose-500
            const ratio = index / (total - 1);
            // Interpolate between Rose-500 (244, 63, 94) and Emerald-500 (16, 185, 129)
            const r = Math.floor(244 + (16 - 244) * ratio);
            const g = Math.floor(63 + (185 - 63) * ratio);
            const b = Math.floor(94 + (129 - 94) * ratio);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function saveAndRender() {
            cleanupDoneTasks();
            localStorage.setItem('spectrumTasks', JSON.stringify(tasks));
            localStorage.setItem('spectrumDone', JSON.stringify(doneTasks));
            
            // Update Dashboard
            document.getElementById('count-pending').innerText = tasks.length;
            document.getElementById('count-done').innerText = doneTasks.length;

            // Render Pending
            taskListEl.innerHTML = tasks.map((t, i) => {
                const color = getColor(i, tasks.length);
                return `
                    <div class="task-item glass p-4 rounded-xl flex items-center gap-4 group" data-id="${t.id}" style="border-left: 6px solid ${color}">
                        <input type="checkbox" onclick="completeTask(${t.id})" class="w-5 h-5 cursor-pointer accent-emerald-500">
                        <div class="flex-grow">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-slate-700 text-slate-300">${t.subject || 'Task'}</span>
                                <span class="text-xs text-slate-400">${t.dueDate || ''}</span>
                            </div>
                            <h3 class="font-semibold">${t.title}</h3>
                        </div>
                        <button onclick="deleteTask(${t.id})" class="text-slate-600 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                `;
            }).join('');

            // Render Done
            doneListEl.innerHTML = doneTasks.map(t => `
                <div class="glass p-3 rounded-lg flex items-center justify-between border-l-4 border-slate-600">
                    <div>
                        <h4 class="text-sm line-through text-slate-500">${t.title}</h4>
                        <p class="text-[10px] text-slate-600">Finished: ${new Date(t.completedAt).toLocaleTimeString()}</p>
                    </div>
                    <button onclick="deleteTask(${t.id}, true)" class="text-slate-700 hover:text-rose-500">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        // Run on load
        saveAndRender();
    </script>
</body>
</html>
